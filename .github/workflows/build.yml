name: Build apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Viewer test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: test-output/*.png

  android:
    name: Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run cap:sync
      - name: Build APKs (DWG-Field and DWG-Field Plus)
        working-directory: android
        run: ./gradlew assembleViewerDebug assemblePlusDebug
      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/viewer/debug/app-viewer-debug.apk DWG-Field.apk
          cp android/app/build/outputs/apk/plus/debug/app-plus-debug.apk DWG-Field-Plus.apk
      - name: Check both APKs open DWG and DXF files and carry the right app
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in DWG-Field.apk DWG-Field-Plus.apk; do
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
            grep -q 'android.intent.action.VIEW' manifest.txt
            grep -q 'android.intent.action.SEND' manifest.txt
            grep -q 'image/vnd.dwg' manifest.txt
            grep -q 'dxf' manifest.txt
          done
          test "$("$AAPT2" dump packagename DWG-Field.apk)" = "com.superduty335.dwgfield"
          test "$("$AAPT2" dump packagename DWG-Field-Plus.apk)" = "com.superduty335.dwgfield.plus"
          unzip -p DWG-Field.apk assets/public/index.html | grep -q '<title>DWG-Field</title>'
          unzip -p DWG-Field-Plus.apk assets/public/index.html | grep -q '<title>DWG-Field Plus</title>'
          "$AAPT2" dump strings DWG-Field-Plus.apk | grep -q 'DWG-Field Plus'
          echo "Both APKs open DWG and DXF files from Open with and Share; Plus has its own id, name and page"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            DWG-Field.apk
            DWG-Field-Plus.apk
          if-no-files-found: error
      # A rolling "latest" pre-release, so the newest APK can be downloaded straight from a phone.
      - name: Publish latest test build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest DWG-Field.apk DWG-Field-Plus.apk --prerelease --title "Latest test build" \
            --notes "Android test builds from $(git rev-parse --short HEAD). DWG-Field.apk is the viewer; DWG-Field-Plus.apk adds points, drafting and object snap. Download one (or both, they install side by side) on your phone and open it to install." \
            --target "$GITHUB_SHA"

  ios:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cap:sync
      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
